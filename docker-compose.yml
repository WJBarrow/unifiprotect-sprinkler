services:
  sprinkler:
    build: .
    restart: unless-stopped
    ports:
      - "8383:8383"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8383/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
